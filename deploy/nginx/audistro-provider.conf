# Replace provider.example and certificate paths before use.
server {
    listen 443 ssl http2;
    server_name provider.example;

    ssl_certificate /etc/letsencrypt/live/provider.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/provider.example/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    send_timeout 300s;

    gzip off;

    location /internal/ {
        return 403;
    }

    location = /metrics {
        return 404;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        return 404;
    }
}
